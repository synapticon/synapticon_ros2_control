name: Industrial CI

on:
  push:
    branches: [ jazzy-devel ]
  # No branch filter: it matches the target branch, and PRs may target other PR branches.
  pull_request:
  workflow_dispatch:

jobs:
  industrial_ci:
    strategy:
      matrix:
        env:
          - {ROS_DISTRO: jazzy, ROS_REPO: main}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{ matrix.env }}
