# Controllers of the test robot geared_offset.yaml. motor_command_controller moves the output joint_1, the drive
# controller switches the drive of motor_1.

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz, equal to control_frequency of the robot definition
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    drive_controller:
      type: synapticon_controllers/DriveController
    ethercat_bus_monitor_controller:
      type: synapticon_controllers/EthercatBusMonitorController
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    motor_command_controller:
      type: synapticon_controllers/MotorCommandController

joint_state_broadcaster:
  ros__parameters:
    joints: [joint_1, motor_1]  # the example launch sets it from the robot definition
    interfaces: [position, velocity, effort]

drive_controller:
  ros__parameters:
    joints: [motor_1]  # the example launch sets it from the robot definition

forward_position_controller:
  ros__parameters:
    joints: [joint_1]
    interface_name: position

motor_command_controller:
  ros__parameters:
    joints: [joint_1]
