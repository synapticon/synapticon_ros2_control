# Slave_config of the SOMANET Circulo SMM, for CSP and impedance mode.
# Generated by esi_to_slave_config.py from SOMANET_CiA_402_v5.6.11.xml.
# All factors are 1. The HAL reads the units of the drive at bring-up and converts to SI units itself.
# Positions, velocities and the effort state are on the shaft of the position encoder, the torque commands on the
# output shaft. On a geared drive whose position encoder is the commutation encoder, that shaft is the motor shaft,
# so the states and the torque commands differ by the gear ratio. Bring-up warns about it.
# The robot description picks the mode of each joint: mode_of_operation 8 is CSP, -6 is impedance.
vendor_id: 0x000022d2
product_id: 0x00000302
assign_activate: 0x0300  # distributed clock activation from the ESI file

# Startup SDOs are written in PRE-OP at every bring-up. Check each value for your drive and your machine.
#
# 0x605A, the quick stop option code, decides what a quick_stop request does:
#   6  ramps down and stays powered in Quick Stop Active, holding the joint
#   2  ramps down and then takes the power off (the factory setting)
#   any other value disables the drive at once
# Bring-up reads 0x605A back, and the quick stop deceleration 0x6085 too. This file leaves 0x6085 to the
# commissioning of the drive. To set it at every bring-up, enable its sdo_si entry below.
#
# 'sdo' holds values without a unit, written as they are. An object whose unit depends on the drive's
# commissioning goes into 'sdo_si' with si_value in SI units: bring-up reads the drive's units first and
# converts it. Velocities and positions are on the shaft of the position encoder. Torques are in Nm at the
# motor, as the drive counts them in thousandths of the motor's rated torque (0x6076).
# The values are in the drive's own direction: the joint's 'invert' does not apply to them.
# Any other object in 'sdo' needs 'raw: true' to say the value is meant as written.
#
# Impedance mode:
#   0x2060:3  gain of the inner torque loop. Raise it in small steps.
#   0x2150:1  torque sensor type, must be set. With no sensor: 1 (analog input), all analog coefficients 0.
#             Store it on the drive once, or enable the 0x2150 entry below to write it at every bring-up.
# The stiffness, the damping and the torque ceiling (0x2054) are streamed. They come from the commands, and
# from the robot definition where a command leaves them out.
sdo:
  # quick stop option code
  - { index: 0x605a, sub_index: 0, type: int16, value: 6 }
  # gain of the inner torque loop
  - { index: 0x2060, sub_index: 3, type: real32, value: 1.0 }
  # torque sensor type, see the impedance note
  # - { index: 0x2150, sub_index: 1, type: uint8, value: 1 }
sdo_si:
  # quick stop deceleration in rad/s^2 on the position shaft, see the note on 0x605A
  # - { index: 0x6085, sub_index: 0, type: uint32, si_value: 200.0 }

rpdo:
  - index: 0x1600
    channels:
      # controlword, set by the CiA 402 state handling only
      - { index: 0x6040, sub_index: 0, type: uint16, command_interface: control_word, default: 0 }
      # mode of operation, -6 (impedance) while no mode is commanded
      - { index: 0x6060, sub_index: 0, type: int8, command_interface: mode_of_operation, default: -6 }
      # rest position of the impedance spring, or the CSP setpoint
      - { index: 0x607a, sub_index: 0, type: int32, command_interface: position, factor: 1.0, default: .nan }
      # velocity setpoint or feedforward
      - { index: 0x60ff, sub_index: 0, type: int32, command_interface: velocity, factor: 1.0, default: 0 }
      # extra output torque [mNm], fed by the effort command
      - { index: 0x2053, sub_index: 0, type: int32, command_interface: joint_torque_offset, factor: 1.0, default: 0 }
      # impedance stiffness [mNm/rad], sent every cycle
      - { index: 0x2060, sub_index: 1, type: int32, command_interface: stiffness, factor: 1.0, default: 0 }
      # impedance damping, sent every cycle
      - { index: 0x2060, sub_index: 2, type: int32, command_interface: damping, factor: 1.0, default: 0 }
      # torque cap [mNm], sent every cycle. Its first value is the joint's max_joint_torque if set, else what the drive has stored
      - { index: 0x2054, sub_index: 0, type: uint32, command_interface: max_joint_torque, factor: 1.0, default: 0 }
tpdo:
  - index: 0x1a00
    channels:
      # statusword with the CiA 402 state
      - { index: 0x6041, sub_index: 0, type: uint16, state_interface: status_word }
      # mode the drive is running in
      - { index: 0x6061, sub_index: 0, type: int8, state_interface: mode_of_operation }
      # measured position
      - { index: 0x6064, sub_index: 0, type: int32, state_interface: position, factor: 1.0 }
      # measured velocity
      - { index: 0x606c, sub_index: 0, type: int32, state_interface: velocity, factor: 1.0 }
      # measured motor torque, which the HAL gives on the shaft of the position encoder
      - { index: 0x6077, sub_index: 0, type: int16, state_interface: effort, factor: 1.0 }
      # code of the last error
      - { index: 0x603f, sub_index: 0, type: uint16, state_interface: error_code }
  - index: 0x1a02
    channels:
      # DC link voltage [mV -> V]
      - { index: 0x6079, sub_index: 0, type: uint32, state_interface: dc_link_voltage, factor: 1.0 }
      # inverter temperature [millidegree C -> degree C], unit assumed
      - { index: 0x2031, sub_index: 1, type: int32, state_interface: temperature_inverter, factor: 1.0 }
      # core board temperature [millidegree C -> degree C], unit assumed
      - { index: 0x2030, sub_index: 1, type: int32, state_interface: temperature_core, factor: 1.0 }
      # motor current, magnitude of (Id, Iq) [mA -> A]
      - { index: 0x2041, sub_index: 1, type: int32, state_interface: motor_current, factor: 1.0 }
      # error report: 8 ASCII bytes in a real64 slot, decoded by the HAL and the drive controller
      - { index: 0x203f, sub_index: 1, type: real64, state_interface: error_report }
      # torque demand after the cap [mNm -> Nm]
      - { index: 0x2052, sub_index: 0, type: int32, state_interface: joint_torque_demand, factor: 1.0 }
